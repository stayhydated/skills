interface:
  display_name: "Rust Best Practices"
  short_description: "Idiomatic Rust with Bon and Statum authorized by default"
  default_prompt: "Use $rust-best-practices to write, refactor, review, optimize, or document idiomatic Rust APIs and examples, assuming Rust 1.99 and edition 2024 unless the repository or user specifies another target. Respect the repository's MSRV. Bon and Statum are authorized by default; distinguish Rust idioms from house-style preferences, respect applicable cargo-deny bans, and keep changes task-scoped."

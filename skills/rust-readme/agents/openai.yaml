interface:
  display_name: "Rust README"
  short_description: "Concise Rust READMEs with idiomatic usage examples"
  default_prompt: "Use $rust-readme to create, revise, or audit concise Rust READMEs from repository evidence: identify direct consumers and facade routes, state verified requirements, use linked Crate/Purpose workspace tables, document every Cargo feature and default bundle, and show idiomatic examples with required context and results, useful domain-specific API/source routes, and complete-source links for excerpts. At a workspace root, use exactly one verified registry badge for an evidenced public facade or primary consumer package, otherwise none; retain applicable shared/additional badges and member-scoped badges. Keep core badges ordered CI, Codecov, Book, crates.io, judge canonical Book coverage by reader audience, and report missing direct-consumer guide routes without expanding the task. Omit filler that merely explains links, file organization, resource loading, or where examples are repeated/tested; omit license prose, installation and contribution material, and repeated book navigation."

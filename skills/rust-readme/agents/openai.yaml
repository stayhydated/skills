interface:
  display_name: "Rust README"
  short_description: "Concise Rust READMEs with idiomatic usage examples"
  default_prompt: "Use $rust-readme to create, revise, or audit concise Rust READMEs from repository evidence: identify direct consumers and facade routes, state verified requirements and compatibility, use linked two-column Crate/Purpose workspace tables, document every Cargo feature with its purpose, defaults, and bundle membership, and show idiomatic examples suited to the package with context, expected results, and complete-source links for excerpts. Keep detailed shared behavior in its owning documentation, scope badges to their packages or workspace with member Codecov components where verified, keep core badges ordered CI, Codecov, Book, crates.io, allow other relevant verified badges, and omit license sections and prose, installation instructions, contribution sections or links, and duplicated book navigation."

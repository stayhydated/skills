# Dependencies used by rust-best-practices Markdown examples.
[dependencies]
anyhow = "1"
bon = { features = [ "experimental-overwritable" ], version = "3.9" }
genco = "0.19"
proc-macro2 = "1"
quote = "1"
statum = "0.9"
strum = "0.28"
strum_macros = "0.28"
syn = { features = [ "full" ], version = "2" }
thiserror = "2"
tracing = "0.1"

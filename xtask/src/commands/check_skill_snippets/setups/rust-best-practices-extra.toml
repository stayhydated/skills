# Dependencies used by rust-best-practices-extra Markdown examples.
rust-version = "1.99"

[dependencies]
askama = "=0.16.1"
bon = { features = [ "experimental-overwritable" ], version = "3.10" }
genco = "0.19"
proc-macro2 = "1"
quote = "1"
statum = "0.9"
strum = "0.28"
strum_macros = "0.28"
syn = { features = [ "full" ], version = "3" }
trybuild = "=1.0.121"

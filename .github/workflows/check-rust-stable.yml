name: Check Rust stable release

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-rust-stable:
    name: Check Rust stable release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
        with:
          toolchain: 1.99.0

      - name: Compare tracked Rust baseline with stable
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUST_STABLE_MANIFEST: https://static.rust-lang.org/dist/channel-rust-stable.toml
        run: |
          cargo xtask check-rust-stable --create-issue
